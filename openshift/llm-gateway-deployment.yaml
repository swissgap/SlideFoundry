apiVersion: apps/v1
kind: Deployment
metadata:
  name: presentation-factory-llm-gateway
  labels:
    app.kubernetes.io/name: presentation-factory
    app.kubernetes.io/component: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: presentation-factory
      app.kubernetes.io/component: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: presentation-factory
        app.kubernetes.io/component: llm-gateway
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-gateway
          image: image-registry.openshift-image-registry.svc:5000/CHANGE_NAMESPACE/presentation-factory-llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: presentation-factory-llm-config
            - secretRef:
                name: presentation-factory-llm-secrets
          readinessProbe:
            httpGet:
              path: /api/llm/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/llm/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
